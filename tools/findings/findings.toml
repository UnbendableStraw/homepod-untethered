[[findings]]
id = "dgst-enforced"
status = "confirmed"
evidence = ["FINDINGS.md:1381"]
related = ["checkm8-t7000-patch"]
title = '''DGST (the IM4M digest) IS enforced by SecureROM — proven by paired
hardware experiment, not by reading the (checkm8-patched) dump. The static
reading that suggested otherwise was an artefact of gaster's patch being present
in the ROM bytes that were dumped.'''

[[findings]]
id = "flash-path-nonce-ignored"
status = "proven_static"
evidence = ["FINDINGS.md:1725", "README.md:89"]
related = ["checkm8-t7000-patch"]
title = '''A cold flash boot ignores the hardware APNonce: on the flash path
img4_open passes flags with bit 2 set, steering the check to compare signed BNCH
against a hash of the unauthenticated IM4R/BNCN (or skipping BNCH entirely if
BNCN is absent/not 8 bytes) rather than reading the hardware nonce. Corrected and
emulation-backed.'''

[[findings]]
id = "snapshot-boot"
status = "confirmed"
evidence = ["FINDINGS.md:4802", "README.md:71"]
related = ["R3", "R13.1"]
title = '''The OS boots the sealed APFS ROOT SNAPSHOT (com.apple.os.update-<hash>),
not the live volume — observed every boot via kernel log. Edits to the live
volume from the SSH ramdisk are invisible to the running OS unless re-snapshotted
with snaputil. This invalidated several earlier plant-on-the-live-volume results
and is the foundation of the route-2 (R3) workflow.'''

[[findings]]
id = "glitch-target-b3"
status = "proven_static"
evidence = ["FINDINGS.md:4317", "README.md:95", "TODO.md:91"]
related = ["cpfm-demotion"]
title = '''Fault simulation of pristine SecureROM shows that skipping a single
cbnz at 0x10000781c makes the ROM accept an arbitrary unsigned image regardless
of CPFM fuses or GPIO straps. A HARDWARE route (needs a voltage glitcher on the
A8 core rail); recorded as the single most promising fault-injection target.'''

[[findings]]
id = "sep-anti-replay-generator"
status = "proven_static"
evidence = ["FINDINGS.md:2925", "README.md:93"]
related = ["R13"]
title = '''Constraint for any future untethered DOWNGRADE (Newport/blackbird
ART forgery on A8): saved SHSH tickets fetched against random live DFU nonces
only work tethered. Tickets must be banked against a DETERMINISTIC APNonce
derived from a known com.apple.System.boot-nonce generator — which requires
patching p.Bits.KernelOnly on the ramdisk kernelcache to set it. Blobs banked
the old way are banked wrong for this purpose.'''

