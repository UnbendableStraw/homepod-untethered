[[findings]]
id = "R3"
status = "confirmed"
evidence = ["FINDINGS.md:4860", "README.md:72"]
related = ["R3.1", "R3.3", "amfi-cdhash-live"]
title = '''Persistent root userland execution. AMFI validates binaries by cdhash
against the static trust cache, NOT by path, so any trust-cached Apple binary's
bytes placed at a cached RunAtLoad root daemon path run as root on every cold
boot with nothing integrity-protected touched.'''

[[findings]]
