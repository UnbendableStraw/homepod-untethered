Apple's installed devicetree, kernelcache, sep-firmware and StaticTrustCache
BYTE-FOR-BYTE (exact MD5 on four independent components). No Apple server, no
secret. Concrete proof that saving a blob is sufficient to rebuild bootable
per-device firmware.'''

[[findings]]
