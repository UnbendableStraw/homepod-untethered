# homepod-untethered — structured findings registry
#
# Purpose: a machine-readable distillation of FINDINGS.md (an append-only,
# chronological lab notebook that must be read bottom-up and contains several
# retracted mid-session claims). This file lets a reader — or a tool — see each
# finding's FINAL status without re-reading 6,400 lines, and makes retractions
# explicit so nobody builds on a disproven result. See README.md:7-8.
#
# This registry is a NAVIGATION AID, not a source of truth. FINDINGS.md and
# README.md remain authoritative; every entry cites them. Where the notebook
# flip-flopped (notably R5), `status` is the FINAL state and `history` notes the
# intermediate claim that was withdrawn.
#
# Format: TOML, parsed with the Python standard library (tomllib, 3.11+). No
# third-party dependency — `python3 validate.py` runs first try.
#
# status values:
#   confirmed        proven on hardware or by exact byte/MD5 match
#   proven_static    proven by instruction-level static analysis (no pod needed)
#   open             active, not yet resolved
#   closed_negative  a real avenue tested and shown to be a dead end
#   retracted        a claim recorded and later disproven; kept so it is not
#                    re-attempted. `retracted_by` points to what killed it.
#
# Cross-reference fields (all optional):
#   supersedes / superseded_by   this entry replaces / is replaced by another id
#   retracted_by                 FILE:LINE anchor of what disproved this entry
#   related                      loosely-coupled entry ids
#
# evidence: list of "FILE:LINE" anchors (section starts), relative to repo root.

schema_version = 1
source_commit_note = """
Line anchors are valid for FINDINGS.md / README.md / TODO.md as committed in the
docs-only tree (FINDINGS.md = 6467 lines). Re-run validate.py after editing any
source document; line drift is expected and the validator only checks that an
anchor falls within the file, not that it still points at the same text."""


