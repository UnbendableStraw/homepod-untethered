title = '''The seatbelt sandbox follows the SUBSTITUTED BINARY's own
code-signature entitlements, not the host launchd job. Several shipped binaries
(syslogd, pppd, nvram) carry no seatbelt profile.'''

[[findings]]
id = "amfi-cdhash-live"
